{% macro album_card(album) %}<a class="album-card" data-album-id="{{ album.id }}" href="{{ url_for('community.album',album_id=album.id) }}">{% if album.cover %}<img src="{{ url_for('community.asset',file_id=album.cover.id) }}" alt="Portada de {{ album.title }}" loading="lazy">{% else %}<div class="album-empty-cover"><span>▧</span><small>Las fotos de este encuentro estarán aquí.</small></div>{% endif %}<div><span class="album-photo-count">{{ album.photo_count }} {{ 'fotografía' if album.photo_count==1 else 'fotografías' }}</span><h3>{{ album.title }}</h3><p>{{ album.description|truncate(160) }}</p><strong>Abrir álbum ↗</strong></div></a>{% endmacro %}
